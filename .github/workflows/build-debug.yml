name: Build TiebaLite Debug APK

on:
  push:
    branches:
      - main
      - 4.0-dev
      - "feature/**"
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout 仓库
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ 设置 JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "zulu"
          cache: gradle

      # 3️⃣ 赋予 gradlew 执行权限
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 4️⃣ 清理旧构建并构建 Debug APK
      - name: Build Debug APK
        run: ./gradlew clean :app:assembleDebug

      # 5️⃣ 列出 debug 目录下的文件
      - name: List debug APK files
        run: ls -R app/build/outputs/apk/debug

      # 6️⃣ 打印 APK 绝对路径
      - name: Print debug APK absolute path
        run: |
          for f in app/build/outputs/apk/debug/*.apk; do
            echo "Debug APK path: $(realpath "$f")"
          done

      # 7️⃣ 上传 Debug APK 到 artifact
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tieba-lite-debug-apk
          path: app/build/outputs/apk/debug/*.apk
