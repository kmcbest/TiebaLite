name: Build TiebaLite APK (Debug)

on:
  push:
    branches:
      - main
      - 4.0-dev
      - "feature/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "zulu"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Cache Debug Keystore
        uses: actions/cache@v4
        with:
          path: app/debug.keystore
          key: tiebalite-debug-keystore-v1

      - name: Ensure valid debug keystore
        run: |
          if [ -f "app/debug.keystore" ] && keytool -list -keystore app/debug.keystore -storepass android > /dev/null 2>&1; then
            echo "Using valid cached debug.keystore"
          else
            echo "Generating new valid debug keystore..."
            rm -f app/debug.keystore
            keytool -genkeypair -v -keystore app/debug.keystore -storetype JKS -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: always
          cache-read-only: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/4.0-dev' }}

      - name: Build Debug APK
        run: ./gradlew clean :app:assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tieba-lite-debug-apk
          path: app/build/outputs/apk/debug/*.apk
